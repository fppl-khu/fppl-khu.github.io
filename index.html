<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Food Processing &amp; Packaging Lab (FPPL), Department of Food and Nutrition, Kyung Hee University. Active and intelligent food packaging research.">
<meta property="og:title" content="Food Processing &amp; Packaging Lab (FPPL) · Kyung Hee University">
<meta property="og:description" content="경희대학교 식품영양학과 식품가공·포장 연구실 · Active and intelligent food packaging research">
<meta property="og:image" content="images/gallery/lab-group.jpg">
<title>Food Processing &amp; Packaging Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: Kyung Hee Blue hero with an interactive journal-style graphical abstract of the four research areas; every other section is its own tab view; Kyung Hee Red and Gold only as small accents */
:root {
  --bg: #FFFFFF;
  --tint: #F4F6FA;
  --fg: #121826;
  --muted: #5B6474;
  --line: #E3E7EE;
  --navy: #0D326F;
  --navy-deep: #082250;
  --link: #0D326F;
  --crimson: #A40F16;
  --gold: #C0A353;
  --soft: #EBF0F8;
  --ex: #B26B12;
  --on-navy: #F3F6FB;
  --on-navy-muted: #B9C6DD;
  --ill-bg: #F1F4FA;
  --ill-card: #FFFFFF;
  --ill-ink: #1C2A44;
  --ill-muted: #5B6474;
  --ill-line: #C9D3E3;
  --ill-film: #0D326F;
  --ill-bubble: #5C86C9;
  --hdr: 84px;
  --font-ko: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-en: "Outfit", "IBM Plex Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1222; --tint: #0F182B; --fg: #E7ECF4; --muted: #9AA6BA; --line: #22304A;
    --link: #9DB8EA; --crimson: #E0697C; --soft: #16223A; --ex: #E2A64E;
    --ill-bg: #111B2E; --ill-card: #18243B; --ill-ink: #E7ECF4; --ill-muted: #9AA6BA; --ill-line: #2E3E5C; --ill-film: #4F78BF; --ill-bubble: #8FB0E8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1222; --tint: #0F182B; --fg: #E7ECF4; --muted: #9AA6BA; --line: #22304A;
  --link: #9DB8EA; --crimson: #E0697C; --soft: #16223A; --ex: #E2A64E;
  --ill-bg: #111B2E; --ill-card: #18243B; --ill-ink: #E7ECF4; --ill-muted: #9AA6BA; --ill-line: #2E3E5C; --ill-film: #4F78BF; --ill-bubble: #8FB0E8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--hdr) + 16px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ko); font-size: 1rem; line-height: 1.75; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
h1, h2, h3, h4 { text-wrap: balance; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--crimson); outline-offset: 3px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.ex { color: var(--ex); font-weight: 600; font-size: 0.85em; }

/* Header */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: var(--hdr); }
.brand { display: flex; align-items: center; gap: 16px; color: var(--fg); text-decoration: none; min-width: 0; }
.logo-slot { flex: none; display: flex; align-items: center; }
.logo-slot img { height: 40px; width: auto; max-width: none; display: block; }
:root[data-theme="dark"] .site-header .logo-slot { background: #fff; padding: 4px 8px; border-radius: 6px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .site-header .logo-slot { background: #fff; padding: 4px 8px; border-radius: 6px; } }
.brand-div { width: 1px; height: 36px; background: var(--line); flex: none; }
.lab-logo { display: flex; align-items: center; flex: none; }
.lab-logo img { height: 58px; width: auto; max-width: none; display: block; }
.lab-logo .on-dark { display: none; }
:root[data-theme="dark"] .site-header .lab-logo .on-light { display: none; }
:root[data-theme="dark"] .site-header .lab-logo .on-dark { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .site-header .lab-logo .on-light { display: none; }
  :root:not([data-theme="light"]) .site-header .lab-logo .on-dark { display: block; }
}
.right { display: flex; align-items: center; gap: 10px; }
.nav { display: flex; gap: 2px; }
.nav a { color: var(--fg); text-decoration: none; font-size: 0.92rem; font-weight: 500; padding: 8px 12px; border-radius: 6px; }
.nav a:hover { color: var(--link); background: var(--soft); }
.nav a[aria-current="page"] { color: var(--link); background: var(--soft); font-weight: 600; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.lang button { font: 600 0.75rem var(--font-en); letter-spacing: 0.04em; border: 0; background: none; color: var(--muted); padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--navy); color: #fff; }

/* Hero */
.hero { background: radial-gradient(70% 90% at 80% 40%, #14468F 0%, transparent 70%), var(--navy-deep); color: var(--on-navy); overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.25fr); gap: 40px; align-items: center; padding-block: 56px; }
.eyebrow { font: 500 0.74rem var(--font-en); letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 22px; display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--crimson); flex: none; }
.hero .eyebrow { color: var(--on-navy-muted); }
.hero h1 { font-weight: 600; font-size: clamp(2rem, 3.9vw, 2.9rem); line-height: 1.25; letter-spacing: -0.03em; margin: 0; text-wrap: initial; }
.hero .alt-name { font-size: 1.05rem; font-weight: 400; color: var(--on-navy-muted); margin: 10px 0 0; }
.hero .lede { color: #CBD5E6; font-weight: 300; font-size: 1.05rem; max-width: 34rem; margin: 24px 0 32px; }
@media (min-width: 1081px) { .hero .lede { min-height: 3.5em; } .hero .alt-name { white-space: nowrap; } }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 500; font-size: 0.92rem; padding: 11px 20px; border-radius: 6px; border: 1px solid transparent; }
.btn-solid { background: #fff; color: var(--navy-deep); }
.btn-solid:hover { background: #E6ECF6; }
.btn-line { color: var(--on-navy); border-color: rgba(243,246,251,.35); }
.btn-line:hover { background: rgba(255,255,255,.08); }
/* Hero figure: a journal-style graphical abstract on a white card (one fixed look in both themes) */
.figure { margin: 0; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 14px 14px 10px; box-shadow: 0 30px 60px -32px rgba(0, 0, 0, .65); }
.figure svg { width: 100%; height: auto; max-width: 100%; display: block; font-family: var(--font-ko); }
.figure figcaption { color: #3A4558; font-size: 0.95rem; line-height: 1.55; padding: 8px 8px 2px; min-height: 3.2em; }
.figure figcaption b { color: #0D326F; font-weight: 600; }
.figure a { cursor: pointer; outline: none; }
.figure .sector { transition: transform .25s ease, opacity .25s ease; }
.figure svg.has-active .sector { opacity: .32; }
.figure svg .sector.on { opacity: 1; transform: translate(var(--dx), var(--dy)); }
.figure svg .sector.on .ring { filter: drop-shadow(0 8px 12px rgba(13, 50, 111, .22)); stroke-opacity: 1; stroke-width: 2; }
@media (prefers-reduced-motion: reduce) { .figure .sector { transition: none; } }

/* Sections and tab views */
main { min-height: 60vh; }
section.sec { padding-block: 80px 96px; }
section.sec.tint { background: var(--tint); }
.sec-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 40px; margin-bottom: 44px; align-items: end; }
.sec-head .eyebrow { color: var(--link); margin-bottom: 12px; }
.sec-head h2 { font-weight: 600; font-size: clamp(1.7rem, 3.2vw, 2.3rem); line-height: 1.3; letter-spacing: -0.03em; margin: 0; }
.sec-head p { margin: 0; color: var(--muted); max-width: 56ch; }
.subhead { font-weight: 600; font-size: 1.15rem; letter-spacing: -0.02em; margin: 64px 0 14px; }

/* About */
.photo-wide { position: relative; aspect-ratio: 21 / 8; max-width: 100%; margin: 0 0 48px; border-radius: 10px; overflow: hidden; background: var(--soft); }
.photo-wide .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 1.2s ease; }
.photo-wide .slide.on { opacity: 1; }
#lab-photo-1 { object-position: 50% 24%; }
#lab-photo-2 { object-position: 50% 30%; }
.dots { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 6px; z-index: 2; }
.dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: rgba(255,255,255,.55); cursor: pointer; }
.dots button[aria-pressed="true"] { background: #fff; }
@media (prefers-reduced-motion: reduce) { .photo-wide .slide { transition: none; } }
.credit { position: absolute; right: 12px; bottom: 10px; z-index: 2; font-size: 0.7rem; color: #fff; background: rgba(8, 34, 80, .55); padding: 2px 8px; border-radius: 4px; }
.about { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 64px; }
.about p { margin: 0 0 16px; color: var(--muted); max-width: 62ch; }
.about p.first { color: var(--fg); font-size: 1.15rem; font-weight: 500; }
.facts { margin: 0; border-top: 2px solid var(--navy); }
.facts div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.facts dt { font-size: 0.82rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; }

/* Research */
.areas { display: grid; gap: 28px; }
.area { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.area:nth-child(even) .ill { order: 2; }
.area .ill { background: var(--ill-bg); padding: 20px 22px; display: grid; place-items: center; min-width: 0; }
.area .ill svg { width: 100%; height: auto; max-width: 100%; display: block; font-family: var(--font-ko); }
.area .body { padding: 36px 36px 32px; display: grid; gap: 12px; align-content: center; min-width: 0; }
.area .num { font: 600 0.8rem var(--font-en); letter-spacing: 0.08em; color: var(--crimson); text-transform: uppercase; }
.area h3 { font-weight: 600; font-size: 1.45rem; letter-spacing: -0.02em; margin: 0; line-height: 1.35; }
.area p { margin: 0; color: var(--muted); }
.deep { grid-column: 1 / -1; order: 3; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 36px; padding: 32px 36px 36px; border-top: 1px solid var(--line); }
.deep h4 { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em; color: var(--link); margin: 0 0 6px; }
.deep h4:not(:first-child) { margin-top: 22px; }
.deep p { color: var(--fg); font-size: 0.95rem; line-height: 1.8; }
.paper { margin: 0; display: grid; gap: 12px; align-content: start; }
.paper .pf { border-radius: 10px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
.paper .pf img { width: 100%; height: auto; max-height: 620px; object-fit: contain; display: block; }
.paper .pf.tbd { aspect-ratio: 2 / 1; display: grid; place-items: center; text-align: center; padding: 20px; border-style: dashed; background: var(--soft); color: var(--muted); font-size: 0.86rem; }
.paper .fcap { margin: -4px 0 0; font-size: 0.82rem; color: var(--muted); line-height: 1.55; }
.paper figcaption { font-size: 0.85rem; line-height: 1.6; color: var(--muted); }
.paper figcaption .lead { display: block; color: var(--fg); font-weight: 600; margin-bottom: 2px; }
.paper figcaption .pt { color: var(--fg); }
.paper figcaption .if { display: inline-block; font: 600 0.74rem var(--font-en); color: #fff; background: var(--navy); border-radius: 4px; padding: 1px 6px; margin: 0 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tags span { font: 500 0.75rem var(--font-en); padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); }
.patents { border-top: 2px solid var(--navy); }
.patent { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 24px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
.patent b { font-weight: 500; }
.patent .meta { color: var(--muted); font-size: 0.88rem; }
.status { font-size: 0.78rem; color: var(--muted); white-space: nowrap; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
.status.on { color: var(--crimson); border-color: color-mix(in srgb, var(--crimson) 40%, transparent); }

/* Filters / sub tabs */
.filters { display: flex; flex-wrap: wrap; gap: 4px; }
.filters button { font: 500 0.88rem var(--font-ko); padding: 6px 14px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
.filters button:hover { color: var(--fg); }
.filters button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.filters small { font-size: 0.75em; opacity: .65; margin-left: 2px; }

/* People */
.prof { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 44px; padding: 32px; align-items: start; margin-bottom: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.photo { background: linear-gradient(160deg, var(--soft), color-mix(in srgb, var(--soft) 60%, var(--line))); display: grid; place-items: center; color: var(--link); font: 500 1.6rem var(--font-en); max-width: 100%; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.prof .photo { aspect-ratio: 3 / 4; border-radius: 10px; box-shadow: 0 18px 40px -24px rgba(8, 34, 80, .55); position: sticky; top: calc(var(--hdr) + 24px); }
.prof .photo img { object-position: 50% 20%; }
.prof .role { font-size: 0.85rem; color: var(--crimson); font-weight: 500; }
.prof h3 { font-weight: 600; font-size: 1.7rem; letter-spacing: -0.03em; margin: 4px 0 0; }
.prof h3 small { font: 400 1rem var(--font-en); color: var(--muted); margin-left: 10px; letter-spacing: 0; }
.prof p { color: var(--muted); margin: 14px 0 0; max-width: 62ch; }
.pinfo { margin: 16px 0 0; display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 14px; font-size: 0.92rem; }
.pinfo dt { color: var(--muted); }
.pinfo dd { margin: 0; overflow-wrap: anywhere; }
.metrics { display: flex; flex-wrap: wrap; gap: 32px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.metrics b { display: block; font: 600 1.6rem var(--font-en); color: var(--link); font-variant-numeric: tabular-nums; line-height: 1.2; }
.metrics span { font-size: 0.8rem; color: var(--muted); }
.note { font-size: 0.76rem !important; color: var(--muted); margin-top: 10px !important; }
.awards { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
.awards h4 { margin: 0 0 10px; font-size: 1rem; font-weight: 600; }
.awards ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.awards li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; font-size: 0.92rem; }
.awards time { font: 500 0.92rem var(--font-en); color: var(--link); font-variant-numeric: tabular-nums; }
.members { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 32px 24px; margin-top: 28px; }
.member { display: grid; gap: 4px; align-content: start; }
.member .photo { aspect-ratio: 1 / 1; border-radius: 8px; margin-bottom: 10px; }
.member h4 { margin: 0; font-size: 1.05rem; font-weight: 600; }
.member .pos { font-size: 0.82rem; color: var(--link); font-weight: 500; }
.member .meta { font: 400 0.8rem var(--font-ko); color: var(--muted); font-variant-numeric: tabular-nums; }
.member .field { margin: 6px 0 0; font-size: 0.86rem; color: var(--fg); line-height: 1.6; }
.member .work { margin: 6px 0 0; font-size: 0.86rem; line-height: 1.55; }
.member .work span { display: block; font-size: 0.74rem; color: var(--muted); }
.scholar { justify-self: start; margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; font: 500 0.78rem var(--font-en); text-decoration: none; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--link); }
.scholar:hover { border-color: var(--link); }
.scholar.off { color: var(--muted); border-style: dashed; }
.scholar svg { width: 12px; height: 12px; }
.empty { color: var(--muted); }

/* Publications */
.pub-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.search { font: inherit; font-size: 0.92rem; padding: 9px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: min(300px, 100%); }
.pub-count { margin: 0 0 6px; font-size: 0.85rem; color: var(--muted); }
.pubs { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--navy); }
.pub { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 20px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.pub .yr { font: 500 1.1rem var(--font-en); color: var(--link); font-variant-numeric: tabular-nums; }
.pub .t { font-weight: 500; margin: 0 0 4px; line-height: 1.5; }
.pub .t a { color: inherit; text-decoration: none; }
.pub .t a:hover { color: var(--link); text-decoration: underline; }
.pub .a { margin: 0; color: var(--muted); font-size: 0.88rem; }
.pub .a b { color: var(--fg); font-weight: 600; }
.pub .j { margin: 2px 0 0; font-size: 0.88rem; font-style: italic; }
.type { font: 500 0.7rem var(--font-en); letter-spacing: 0.04em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-left: 8px; font-style: normal; vertical-align: 2px; }
.more { margin: 24px 0 0; }
.more a { font-weight: 500; }

/* News */
.feature { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); margin-bottom: 40px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
.feature .pic { position: relative; min-height: 100%; }
.feature .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 45% 30%; display: block; aspect-ratio: 3 / 2; }
.feature .txt { padding: 32px; display: grid; gap: 12px; align-content: start; }
.feature .src { font: 500 0.78rem var(--font-en); letter-spacing: 0.06em; color: var(--crimson); text-transform: uppercase; }
.feature h3 { margin: 0; font-size: 1.45rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.35; }
.feature .sub { margin: 0; color: var(--link); font-weight: 500; font-size: 0.95rem; }
.feature p.sum { margin: 0; color: var(--muted); }
.fstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.fstats b { display: block; font: 600 1.35rem var(--font-en); color: var(--link); font-variant-numeric: tabular-nums; }
.fstats span { font-size: 0.76rem; color: var(--muted); line-height: 1.4; display: block; }
.news { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--navy); }
.news li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.news time { font: 500 1rem var(--font-en); color: var(--link); font-variant-numeric: tabular-nums; }
.news .tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 1px 8px; border-radius: 4px; margin-right: 8px; background: var(--soft); color: var(--link); vertical-align: 1px; }
.news .tag.award { background: color-mix(in srgb, var(--gold) 22%, transparent); color: color-mix(in srgb, var(--gold) 55%, var(--fg)); }
.news .tag.story { background: color-mix(in srgb, var(--crimson) 12%, transparent); color: var(--crimson); }
:root[data-theme="dark"] .facts, :root[data-theme="dark"] .patents, :root[data-theme="dark"] .pubs, :root[data-theme="dark"] .news { border-top-color: var(--link); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .facts, :root:not([data-theme="light"]) .patents, :root:not([data-theme="light"]) .pubs, :root:not([data-theme="light"]) .news { border-top-color: var(--link); } }

/* Gallery */

      text: { ko: "포장재나 용기 속 물질이 식품으로 옮겨가는지(이행) 시험하고 분석해, 식품용 기구·용기·포장이 안전 기준을 지키는지 검증합니다. 국내 시험 기준과 가이드라인 개선에도 참여합니다.",
              en: "We test and analyze whether substances move from packaging and containers into food (migration), verifying that food utensils, containers and packaging meet safety standards. We also help improve Korea's test methods and guidelines." },
      tags: ["Migration testing", "Food simulants", "Safety assessment", "Regulation"],
      deep: {
        bg: { ko: "포장재와 용기에는 첨가제, 잔류 단량체, 금속 같은 물질이 들어 있고, 이 중 일부는 식품과 닿는 동안 식품으로 옮겨갈(이행) 수 있습니다. 새로운 바이오 소재와 나노소재가 포장에 쓰이면서, 이들이 안전 기준을 지키는지 확인하는 시험법과 나라별 규격을 이해하는 일이 더 중요해지고 있습니다.",
              en: "Packaging materials and containers contain additives, residual monomers and metals, some of which can move into food on contact (migration). As new bio-based materials and nanomaterials enter packaging, test methods that confirm they meet safety limits, and an understanding of each country's rules, matter more than ever." },
        method: { ko: "식품의약품안전처 「기구 및 용기·포장의 기준 및 규격」에 따라 물, 4% 초산, 20%·50% 에탄올, n-헵탄 같은 식품 유사용매로 이행 시험을 하고, 이행된 물질을 기기 분석으로 정량해 기준치와 비교합니다. 식약처 연구과제를 통해 침출용매와 용출시험법 같은 국내 시험 기준의 개선 연구에도 참여하고 있으며, 바이오플라스틱과 나노소재의 국내외 규격·인증 체계도 분석합니다.",
                  en: "Following Korea's Standards and Specifications for Utensils, Containers and Packages set by the Ministry of Food and Drug Safety (MFDS), we run migration tests with food simulants such as water, 4% acetic acid, 20% and 50% ethanol and n-heptane, quantify migrated substances by instrumental analysis and compare them with legal limits. Through MFDS research projects we also help improve national test methods, including extraction solvents and migration testing, and we analyze domestic and international standards and certification for bioplastics and nanomaterials." },
        case: { ko: "바이오플라스틱의 정의와 세계 시장, 주요 원료·종류·특성을 정리하고, 폐기물 관리와 회수 방법, 주요 표준과 인증, 나라별 규제와 제한 사항을 함께 분석한 종합 리뷰입니다. 바이오플라스틱이 석유계 플라스틱을 대체하려면 소재 특성과 규제 요건을 함께 이해하는 것이 산업화와 상용화에 중요하다는 점을 짚고, 남은 과제와 향후 방향을 제시했습니다.",
                en: "This review covers the terminology, global market, main sources, types and properties of bioplastics, along with waste management and recovery options, the key standards and certifications, and country-specific regulations and restrictions. It argues that understanding both material properties and regulatory requirements is essential for bioplastics to be industrialized, commercialized and adopted in place of petroleum-based plastics, and it outlines remaining challenges and future directions." }
      },
      paper: { authors: "Jayakumar, A., Radoor, S., Siengchin, S., Shin, G. H. & Kim, J. T.*", year: 2023,
               title: "Recent progress of bioplastics in their properties, standards, certifications and regulations: A review",
               journal: "Science of the Total Environment", ref: "878, 163156", doi: "10.1016/j.scitotenv.2023.163156", impact: "8.0", fig: "safety",
               figCap: { ko: "논문의 그래픽 초록: 재생 자원에서 바이오플라스틱 생산, 사용, 폐기, 자연 순환으로 이어지는 흐름과 세계 시장 규모(2021년 242만 톤 → 2026년 759만 톤 전망)", en: "Graphical abstract: the cycle from renewable resources to bioplastic production, use, disposal and back, with global market size (2.42 million tonnes in 2021 to a projected 7.59 million in 2026)" } }
    }
  ],

}

    s += `<line x1="16" y1="62" x2="340" y2="62" stroke="${f.col}" stroke-opacity=".22"/>`;

function renderOverview() {
  const box = document.getElementById("overview"), cap = document.getElementById("overview-cap");
  box.innerHTML = overviewSVG();
  const svg = box.querySelector("svg");
  const setCap = k => {
    const f = FIG.find(x => x.k === k);
    cap.innerHTML = f ? `<b>(${f.letter}) ${esc(L(f.t))}.</b> ${esc(L(f.d))}` : L(FIG_CAP);
    svg.classList.toggle("has-active", !!f);
    svg.querySelectorAll(".sector").forEach(g => g.classList.toggle("on", !!f && g.dataset.k === k));
  };
  svg.querySelectorAll("a[data-k]").forEach(a => {
    a.addEventListener("mouseenter", () => setCap(a.dataset.k));
    a.addEventListener("focus", () => setCap(a.dataset.k));
    a.addEventListener("mouseleave", () => setCap(null));
    a.addEventListener("blur", () => setCap(null));
  });
  setCap(null);
}

  if (!p) return "";
  const authors = esc(p.authors).replace("Kim, J. T.", "<b>Kim, J. T.</b>");
  const src = p.fig ? (PAPER_FIG[p.fig] || p.fig) : "";
  const box = src ? `<div class="pf"><img src="${src}" alt="${esc(p.figCap ? L(p.figCap) : p.title)}" loading="lazy"></div>${p.figCap ? `<p class="fcap">${mark(p.figCap)}</p>` : ""}` : `<div class="pf tbd"><div>${mark(UI.figTbd)}</div></div>`;
  return `<figure class="paper">${box}<figcaption><span class="lead">${mark(UI.ourWork)}</span>${authors} (${p.year}). <span class="pt">${esc(p.title)}</span>. <i>${esc(p.journal)}</i>, ${esc(p.ref)}.<span class="if">IF ${esc(p.impact)}</span><a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">DOI ↗</a></figcaption></figure>`;
}
function scholarLink(url) {
  return url ? `<a class="scholar" href="${esc(url)}" target="_blank" rel="noopener">${SCHOLAR_ICON}Google Scholar ↗</a>`
             : `<span class="scholar off">${SCHOLAR_ICON}${mark(UI.scholarTbd)}</span>`;
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-logo]").forEach(el => { el.innerHTML = `<img src="${KHU_LOGO[lang]}" alt="${lang === "ko" ? "경희대학교" : "Kyung Hee University"}">`; });
  document.querySelectorAll("[data-fppl]").forEach(el => { el.innerHTML = `<img class="on-light" src="${FPPL_LOGO.light}" alt="Food Processing &amp; Packaging Lab"><img class="on-dark" src="${FPPL_LOGO.dark}" alt="Food Processing &amp; Packaging Lab">`; });
  document.querySelectorAll("[data-i]").forEach(el => { const v = UI[el.dataset.i]; if (v) el.innerHTML = markHTML(v); });
  search.placeholder = L(UI.searchPh);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  renderOverview();

  document.getElementById("facts").innerHTML = UI.facts.map(([k, v]) => `<div><dt>${mark(k)}</dt><dd>${mark(v)}</dd></div>`).join("");
  const p1 = document.getElementById("lab-photo-1"), p2 = document.getElementById("lab-photo-2");
  p1.src = GROUP_PHOTO; p1.alt = L(UI.groupPhotoAlt); p2.src = LAB_PHOTO; p2.alt = L(UI.labPhotoAlt);

  document.getElementById("areas").innerHTML = LAB.areas.map((a, i) => `
    <article class="area" id="area-${a.art}">
      <div class="ill">${ART[a.art] ? ART[a.art]() : ""}</div>
      <div class="body"><div class="num">${String(i + 1).padStart(2, "0")} · ${esc(a.en)}</div><h3>${mark(a.title)}</h3><p>${mark(a.text)}</p>
      <div class="tags">${a.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div></div>
      ${a.deep ? `<div class="deep"><div>
        <h4>${mark(UI.deepBg)}</h4><p>${mark(a.deep.bg)}</p>
        <h4>${mark(UI.deepMethod)}</h4><p>${mark(a.deep.method)}</p>
        <h4>${mark(UI.deepCase)}</h4><p>${mark(a.deep.case)}</p></div>
        ${paperFig(a.paper)}</div>` : ""}
    </article>`).join("");
  document.getElementById("patents").innerHTML = LAB.patents.map(p => `
    <div class="patent"><div><b>${mark(p.title)}</b><div class="meta">${esc(p.year)} · ${esc(p.no)}</div></div>
    <span class="status ${p.status.en === "Registered" ? "on" : ""}">${mark(p.status)}</span></div>`).join("");

  const P = LAB.professor;
  document.getElementById("prof").innerHTML = `
    <div class="photo"><img src="${PROF_PHOTO}" alt="${esc(L(P.name))}"></div>
    <div><div class="role">${mark(P.role)}</div><h3>${mark(P.name)}<small>${mark(P.sub)}</small></h3>
    <p>${mark(P.bio)}</p>
    <dl class="pinfo">${P.info.map(([k, v, href]) => `<dt>${mark(k)}</dt><dd>${href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${mark(v)}</a>` : mark(v)}</dd>`).join("")}
      </dl>
    <div class="metrics">${P.metrics.map(m => `<div><b>${esc(m.v)}</b><span>${mark(m.k)}</span></div>`).join("")}</div>
    <p class="note">${mark(UI.metricsNote)}</p>
    ${P.awards && P.awards.length ? `<div class="awards"><h4>${mark(UI.awardsTitle)}</h4><ul>${P.awards.map(a => `<li><time>${esc(a.year)}</time><span>${mark(a.text)}</span></li>`).join("")}</ul></div>` : ""}</div>`;

  document.getElementById("member-filters").innerHTML = GROUPS.map(([g, l]) =>
    `<button type="button" id="mf-${g}" data-g="${g}" aria-pressed="${g === mFilter}">${mark(l)} <small>${LAB.members.filter(m => m.group === g).length}</small></button>`).join("");
  renderMembers();

  const years = [...new Set(LAB.publications.map(p => p.year))].sort((a, b) => b - a);
  const cnt = y => LAB.publications.filter(p => p.year === y).length;
  document.getElementById("pub-filters").innerHTML = years.map(y => `<button type="button" id="py-${y}" data-y="${y}" aria-pressed="${pYear === String(y)}">${y} <small>${cnt(y)}</small></button>`)
    .concat([`<button type="button" id="py-all" data-y="all" aria-pressed="${pYear === "all"}">${mark(UI.fAll)} <small>${LAB.publications.length}</small></button>`]).join("");
  renderPubs();

  document.getElementById("feature").innerHTML = `
    <div class="pic"><img src="${PROF_FEATURE}" alt="${esc(L(UI.featAlt))}"><span class="credit">${esc(L(UI.credit))}</span></div>
    <div class="txt"><div class="src">${esc(L(UI.featSrc))}</div><h3>${esc(L(UI.featTitle))}</h3><p class="sub">${esc(L(UI.featSub))}</p>
    <p class="sum">${esc(L(UI.featSum))}</p>
    <div class="fstats">${UI.featStats.map(x => `<div><b>${esc(x.v)}</b><span>${esc(L(x.k))}</span></div>`).join("")}</div>
    <a href="https://news.khu.ac.kr/news_kor/user/webzine/cType.do?wcId=4059" target="_blank" rel="noopener">${esc(L(UI.featLink))}</a></div>`;
  document.getElementById("news-list").innerHTML = LAB.news.map(n => `<li><time>${mark(n.date)}</time><span>${n.tag ? `<span class="tag ${esc(n.tag)}">${mark(UI[TAGS[n.tag]])}</span>` : ""}${mark(n.text)}</span></li>`).join("");
  renderGallery();
  markNav();
}

function renderMembers() {
  const list = LAB.members.filter(m => m.group === mFilter);
  const yr = y => y ? esc(y) : mark(UI.yearTbd);
  document.getElementById("member-grid").innerHTML = list.length ? list.map(m => {
    const psrc = m.photo ? (MEMBER_PHOTOS[m.photo] || m.photo) : "";
    const photo = psrc ? `<div class="photo"><img src="${psrc}" alt="${esc(L(m.name))}"></div>` : `<div class="photo" role="img" aria-label="${esc(L(m.name))}">${esc(m.initials)}</div>`;
    let info = "";
    if (m.group === "researcher") info = m.interest ? `<p class="field">${mark(m.interest)}</p>` : "";
    else if (m.group === "alumni") info = `<div class="meta">${mark(UI.graduated)} ${yr(m.year)}</div><p class="work"><span>${mark(UI.workplace)}</span>${m.workplace ? mark(m.workplace) : mark(UI.workTbd)}</p>`;
    else info = `<div class="meta">${mark(UI.admitted)} ${yr(m.year)}</div><p class="field">${m.research ? mark(m.research) : mark(UI.researchTbd)}</p>`;
    return `<article class="member">${photo}<h4>${mark(m.name)}</h4><div class="pos">${mark(m.pos)}</div>${info}${m.group === "researcher" ? scholarLink(m.scholar) : ""}</article>`;
  }).join("") : `<p class="empty">${mark(UI.noMembers)}</p>`;
}

function renderPubs() {
  const q = search.value.trim().toLowerCase();
  const list = LAB.publications
    .filter(p => q || pYear === "all" || String(p.year) === pYear)
    .filter(p => !q || [p.title, p.authors, p.source].join(" ").toLowerCase().includes(q));
  document.getElementById("pub-count").textContent = L(UI.pubCount).replace("{n}", list.length);
  document.getElementById("pub-list").innerHTML = list.length ? list.map(p => `
    <li class="pub"><div class="yr">${p.year}</div><div>
    <p class="t">${p.doi ? `<a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">${mark(p.title)}</a>` : mark(p.title)}<span class="type">${esc(p.type)}</span></p>
    <p class="a">${esc(p.authors).replace("Kim, J. T.", "<b>Kim, J. T.</b>")}</p><p class="j">${esc(p.source)}</p></div></li>`).join("")
    : `<li class="pub"><span></span><span class="empty">${mark(UI.noPubs)}</span></li>`;
}

/* ===== 갤러리 ===== */
const IMG = { GROUP_PHOTO, LAB_PHOTO, PROF_FEATURE };
const imgSrc = s => IMG[s] || s;
let gFilter = "all", gList = [], gIndex = 0;
function renderGallery() {
  const cats = [["all", UI.gAll], ["lab", UI.gLab], ["event", UI.gEvent], ["media", UI.gMedia]]
    .filter(([c]) => c === "all" || LAB.gallery.some(g => g.category === c));
  document.getElementById("gallery-filters").innerHTML = cats.map(([c, l]) =>
    `<button type="button" id="gf-${c}" data-c="${c}" aria-pressed="${c === gFilter}">${mark(l)}</button>`).join("");
  gList = LAB.gallery.filter(g => gFilter === "all" || g.category === gFilter);
  document.getElementById("gallery-grid").innerHTML = gList.map((g, i) => `
    <figure class="g-item"><button type="button" data-idx="${i}" aria-label="${esc(L(g.caption))}"><img src="${imgSrc(g.src)}" alt="${esc(L(g.caption))}" loading="lazy"></button>
    <figcaption><time>${esc(g.date)}</time>${esc(L(g.caption))}</figcaption></figure>`).join("");
}
const lb = document.getElementById("lightbox");
function openLb(i) {
  gIndex = (i + gList.length) % gList.length; const g = gList[gIndex];
  document.getElementById("lb-img").src = imgSrc(g.src); document.getElementById("lb-img").alt = L(g.caption);
  document.getElementById("lb-cap").textContent = `${g.date} · ${L(g.caption)}`;
  lb.hidden = false; document.getElementById("lb-close").focus();
}

/* ===== 이벤트 ===== */
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; render();
});
document.getElementById("member-filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mFilter = b.dataset.g; document.querySelectorAll("#member-filters button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderMembers();
});
document.getElementById("pub-filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  pYear = b.dataset.y; document.querySelectorAll("#pub-filters button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderPubs();
});
search.addEventListener("input", renderPubs);
document.getElementById("gallery-filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; gFilter = b.dataset.c; renderGallery();
});
document.getElementById("gallery-grid").addEventListener("click", e => { const b = e.target.closest("button[data-idx]"); if (b) openLb(+b.dataset.idx); });
document.getElementById("lb-close").addEventListener("click", () => { lb.hidden = true; });
document.getElementById("lb-prev").addEventListener("click", () => openLb(gIndex - 1));
document.getElementById("lb-next").addEventListener("click", () => openLb(gIndex + 1));
lb.addEventListener("click", e => { if (e.target === lb) lb.hidden = true; });
addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") lb.hidden = true; else if (e.key === "ArrowLeft") openLb(gIndex - 1); else if (e.key === "ArrowRight") openLb(gIndex + 1);
});

/* ===== 탭 이동: 홈(히어로+About)과 각 탭을 주소의 #이름으로 전환 ===== */
const VIEWS = ["home", "research", "people", "publications", "news", "gallery"];
let view = "home";
function markNav() {
  document.querySelectorAll(".nav a[data-v]").forEach(a => { if (a.dataset.v === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}
function route() {
  const h = location.hash.slice(1);
  if (h === "contact") { document.getElementById("contact").scrollIntoView(); return; }
  const area = h.startsWith("area-") && document.getElementById(h);
  const next = area ? "research" : VIEWS.includes(h) ? h : "home";
  const changed = next !== view;
  view = next;
  document.querySelectorAll("main > [data-view]").forEach(s => { s.hidden = s.dataset.view !== view; });
  markNav();
  if (h === "about" || area) requestAnimationFrame(() => document.getElementById(area ? h : "about").scrollIntoView());
  else if (changed || h) scrollTo(0, 0);
}
addEventListener("hashchange", route);

render();
route();

/* ===== 소개 사진 슬라이드: 두 사진이 번갈아 나타남 ===== */
(function () {
  const slides = [document.getElementById("lab-photo-1"), document.getElementById("lab-photo-2")];
  const dots = [document.getElementById("dot-1"), document.getElementById("dot-2")];
  let cur = 0, timer = null;
  const show = i => { cur = i; slides.forEach((s, k) => s.classList.toggle("on", k === i)); dots.forEach((d, k) => d.setAttribute("aria-pressed", k === i)); };
  const start = () => { if (!matchMedia("(prefers-reduced-motion: reduce)").matches) timer = setInterval(() => { if (!document.hidden) show((cur + 1) % slides.length); }, 5500); };
  dots.forEach((d, k) => d.addEventListener("click", () => { clearInterval(timer); show(k); start(); }));
  start();
})();
</script>
